name: TunedTwo
attributes:
  LastUpgradeCheck: "2660"
packages:
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.8.2
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: 1.6.0
options:
  bundleIdPrefix: io.tunedtwo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  developmentLanguage: en
  groupSortPosition: top
  defaultSourceDirectoryType: syncedFolder
settings:
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "6.0"
  CODE_SIGN_STYLE: Automatic
  ENABLE_HARDENED_RUNTIME: YES
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  DEAD_CODE_STRIPPING: YES
  GENERATE_INFOPLIST_FILE: YES
  # The nrsc5 module map must be visible to every target that touches
  # the TunedTwoCore.swiftmodule dependency chain, not just the framework.
  SWIFT_INCLUDE_PATHS: $(SRCROOT)/Modules
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  STRING_CATALOG_GENERATE_SYMBOLS: YES
  INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
  INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 TunedTwo contributors."
configs:
  Debug: debug
  Release: release
targets:
  TunedTwoCore:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/TunedTwoCore
    dependencies:
      - package: swift-collections
        product: Collections
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tunedtwo.TunedTwoCore
        DEFINES_MODULE: YES
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/nrsc5/build/src
        OTHER_LDFLAGS: -lnrsc5
        # libnrsc5.dylib (install name @rpath/libnrsc5.dylib) is embedded
        # in the framework's own Frameworks/ directory.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/Frameworks"
    prebuildScripts:
      - name: Build libnrsc5
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin"
          "${SRCROOT}/scripts/build-nrsc5.sh"
        inputFiles:
          - $(SRCROOT)/scripts/build-nrsc5.sh
          - $(SRCROOT)/Vendor/nrsc5/include/nrsc5.h
        outputFiles:
          - $(SRCROOT)/Vendor/nrsc5/build/src/libnrsc5.dylib
    postbuildScripts:
      - name: Embed libnrsc5
        script: |
          set -e
          DYLIB_SRC="${SRCROOT}/Vendor/nrsc5/build/src/libnrsc5.dylib"
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "${FRAMEWORKS_DIR}"
          cp -v "${DYLIB_SRC}" "${FRAMEWORKS_DIR}/libnrsc5.dylib"
        inputFiles:
          - $(SRCROOT)/Vendor/nrsc5/build/src/libnrsc5.dylib
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libnrsc5.dylib
        shell: /bin/bash
  TunedTwo:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/TunedTwo
      - path: Resources
    dependencies:
      - target: TunedTwoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tunedtwo.TunedTwo
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    prebuildScripts:
      - name: Prepare sample file
        script: |
          set -e
          "${SRCROOT}/scripts/prepare-sample.sh"
        inputFiles:
          - $(SRCROOT)/scripts/prepare-sample.sh
          - $(SRCROOT)/Vendor/nrsc5/support/sample.xz
        outputFiles:
          - $(SRCROOT)/Resources/sample.bin
  tunedtwo-cli:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/TunedTwoCLI
    dependencies:
      - target: TunedTwoCore
        embed: true
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tunedtwo.tunedtwo-cli
        # TunedTwoCore.framework is linked next to the executable.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path"
          - "@executable_path/Frameworks"
  TunedTwoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/TunedTwoTests
    dependencies:
      - target: TunedTwoCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets:
        - TunedTwoTests
      gatherCoverageData: true
schemes:
  TunedTwo:
    build:
      targets:
        TunedTwo: all
        tunedtwo-cli: build
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TunedTwoTests
